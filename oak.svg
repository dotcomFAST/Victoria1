<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" preserveAspectRatio="none">
  <!-- Smoked European oak: long horizontal grain -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.09" numOctaves="4" seed="9"/>
    <feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0 0.05  1.6 0 0 0 -0.55"/>
  </filter>
  <filter id="fine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.7" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0.10 0"/>
  </filter>
  <rect width="100%" height="100%" fill="#3A2B21"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity=".7"/>
  <rect width="100%" height="100%" filter="url(#fine)"/>
</svg>
